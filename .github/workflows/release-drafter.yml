name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    name: 📝 Update Release Draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Draft release notes
        uses: Bugs5382/release-drafter-action@de0c4559d69039b8b371ef951b62a2532ad3593f # v1.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          extends: Sneakers-PAM/.github@432915be1a619fb8baace1c0ce6c636df8c31312
          first-version: 0.1.0
          prerelease: true
          prerelease-identifier: rc
