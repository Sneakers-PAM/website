name: Link Check
# Checks every link in the built site (apps/site): internal (root-relative)
# links resolve straight to the files in apps/site/build/client with no
# network call; external links are fetched for real, with retries for flaky
# hosts. The docs build checks its own internal links (onBrokenLinks: throw).
# Excluded:
#   - the release binaries, already verified by hand (sha256sum and cosign);
#     re-downloading hundreds of megabytes on every PR would be slow and
#     wasteful;
#   - docs.sneakers-pam.com, until the domain is attached. Remove this
#     exclusion once it resolves.
#
# Pull requests only, and not while the PR is a draft. A change that can't
# reach the site (apps/docs only, or root docs) skips the build and the check;
# scripts/changed-apps.mjs decides.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  link-check:
    name: 🔗 Link Check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The path filter diffs the PR against its base.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the site changed
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/changed-apps.mjs "$BASE" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.changes.outputs.site_changed == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.site_changed == 'true'
        run: npm ci --ignore-scripts

      - name: Build the site
        if: steps.changes.outputs.site_changed == 'true'
        run: npm run build -w @sneakers-pam/site

      - name: Check links
        if: steps.changes.outputs.site_changed == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --verbose
            --root-dir ./apps/site/build/client
            --exclude '^https://github\.com/Sneakers-PAM/sneakers-appliance/releases/download/'
            --exclude '^https://docs\.sneakers-pam\.com/'
            --retry-wait-time 5
            --max-retries 3
            './apps/site/build/client/**/*.html'
          fail: true
          failIfEmpty: true
          jobSummary: true
