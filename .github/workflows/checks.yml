name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event.pull_request.draft != true
    uses: Sneakers-PAM/.github/.github/workflows/scrub.yml@main
    with:
      # The release's own GitHub Release asset host, the production signing
      # key's raw-file host, the fonts, and the npm funding/project links
      # that come in through devDependencies (not a private deployment's
      # host name). The last one came over with the docs app: the fonts'
      # licence site, which the docs' License page links.
      allowed-domains: raw.githubusercontent.com fonts.googleapis.com fonts.gstatic.com opencollective.com tidelift.com paulmillr.com ko-fi.com liberapay.com patreon.com feross.org eslint.org openfontlicense.org # scrub:allow=fqdn

  # One job for both apps, so the required check keeps its name. A change
  # under apps/site or apps/docs builds that app only; anything shared (the
  # packages, the root manifests, the workflows) builds both. Lint and the
  # shared packages' tests are cheap and always run. Pull requests and merge
  # groups only: a push to main lands the tree the PR run already tested.
  build:
    name: 🧪 Build & Test
    if: github.event_name != 'push' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the docs' "last updated" dates come from each page's
          # own commit, and the path filter diffs against the PR's base.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide which apps to build
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/changed-apps.mjs "${BASE:-}" "${HEAD_SHA:-}" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test the shared packages and the release scripts
        run: |
          npm test -w @sneakers-pam/frame -w @sneakers-pam/brand
          node --test scripts/*.test.mjs

      - name: Site - type-check
        if: steps.changes.outputs.site_changed == 'true'
        run: npm run typecheck -w @sneakers-pam/site

      - name: Site - test
        if: steps.changes.outputs.site_changed == 'true'
        run: npm test -w @sneakers-pam/site

      - name: Site - build
        if: steps.changes.outputs.site_changed == 'true'
        run: npm run build -w @sneakers-pam/site

      # Nothing may be written to browser storage before the visitor accepts
      # the cookie choice (scripts/check-no-storage.mjs).
      - name: Site - nothing stored before consent
        if: steps.changes.outputs.site_changed == 'true'
        run: npm run check:storage:site

      - name: Docs - type-check
        if: steps.changes.outputs.docs_changed == 'true'
        run: npm run typecheck -w @sneakers-pam/docs

      - name: Docs - test
        if: steps.changes.outputs.docs_changed == 'true'
        run: npm test -w @sneakers-pam/docs

      # onBrokenLinks, onBrokenAnchors and the markdown link hooks are all
      # set to throw, so a broken internal link fails this step. This build
      # includes vNext, so it checks the released versions and main's pages.
      - name: Docs - build
        if: steps.changes.outputs.docs_changed == 'true'
        run: npm run build -w @sneakers-pam/docs

      # Loads every page, then hydrates a few and uses the theme and
      # full-width switches: nothing may be stored before consent.
      - name: Docs - nothing stored before consent
        if: steps.changes.outputs.docs_changed == 'true'
        run: npm run check:storage:docs
