name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event.pull_request.draft != true
    uses: Sneakers-PAM/.github/.github/workflows/scrub.yml@main
    with:
      # The release's own GitHub Release asset host, the production signing
      # key's raw-file host, the fonts, and the npm funding/project links
      # that come in through devDependencies (not a private deployment's
      # host name).
      allowed-domains: raw.githubusercontent.com fonts.googleapis.com fonts.gstatic.com opencollective.com tidelift.com paulmillr.com ko-fi.com liberapay.com patreon.com feross.org eslint.org # scrub:allow=fqdn

  build:
    name: 🧪 Build & Test
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # hashFiles() is only valid in a step's own `if`/`env`/etc, never a
        # job-level `if` (actionlint). Every step below carries the same
        # guard, so the job is green with everything skipped until the
        # site's package.json lands (issue #4), and switches on by itself
        # once it does.
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Type-check
        if: hashFiles('package.json') != ''
        run: npm run typecheck

      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint

      - name: Test the release data
        if: hashFiles('package.json') != ''
        run: npm test

      - name: Build the site
        if: hashFiles('package.json') != ''
        run: npm run build
