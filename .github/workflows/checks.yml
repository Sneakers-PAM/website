name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event.pull_request.draft != true
    uses: Sneakers-PAM/.github/.github/workflows/scrub.yml@main
    with:
      # The release's own GitHub Release asset host, the production signing
      # key's raw-file host, the fonts, and the npm funding links (not a
      # private deployment's host name).
      allowed-domains: raw.githubusercontent.com fonts.googleapis.com fonts.gstatic.com opencollective.com tidelift.com paulmillr.com ko-fi.com liberapay.com patreon.com feross.org # scrub:allow=fqdn

  build:
    name: 🧪 Build & Test
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test the release data
        run: npm test

      - name: Build the site
        run: npm run build
