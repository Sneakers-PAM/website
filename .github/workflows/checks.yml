name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event.pull_request.draft != true
    uses: Sneakers-PAM/.github/.github/workflows/scrub.yml@main
    with:
      # The site's own Pages domain, the fonts' license site, and the npm
      # funding links baked into package-lock.json.
      allowed-domains: >-
        sneakers-pam.github.io openfontlicense.org opencollective.com tidelift.com
        paulmillr.com ko-fi.com liberapay.com patreon.com feross.org

  build:
    name: 🧪 Build & Test
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so each page's "last updated" date comes from its own commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run typecheck

      - name: Test the screenshot scrub rules
        run: npm test

      # onBrokenLinks, onBrokenAnchors and the markdown link hooks are all
      # set to throw, so a broken internal link fails this step.
      - name: Build the site
        run: npm run build
