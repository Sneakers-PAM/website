name: deploy-updates

# The signed update feed (apps/updates/public) deploys on its own when a change
# under apps/updates lands on main, and by hand. It does not wait for a release:
# the feed files are proposed as pull requests and must go live when merged.
on:
  push:
    branches: [main]
    paths: ["apps/updates/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-updates
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the update feed to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the guard can compare with the previous commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      # A version the feed adds must already have its docs snapshot. On a push
      # compare with the commit before it; a manual run compares with the
      # previous commit on main. No index at that commit means every listed
      # version counts as added.
      - name: Check the docs for versions the feed adds
        env:
          BEFORE: ${{ github.event.before }}
        run: npm run check:feed-docs -- "--base=${BEFORE:-HEAD~1}"

      - name: Deploy the update feed
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            npx wrangler pages project list --json | jq -e '[.[] | select(."Project Name" == "sneakers-pam-updates")] | length > 0' >/dev/null || npx wrangler pages project create sneakers-pam-updates --production-branch=main
          command: pages deploy apps/updates/public --project-name=sneakers-pam-updates --branch=main
