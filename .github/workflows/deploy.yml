name: deploy

# Only a published release deploys, and it deploys both sites: apps/site to
# the Pages project sneakers-pam-www and apps/docs to sneakers-pam-docs. No
# push or pull_request trigger here: a merge to main never deploys on its own.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # A pre-release goes to each project's dev branch (its dev site),
      # anything else to main (production). --branch is always explicit,
      # because a release run checks out a detached tag and would otherwise
      # deploy as a preview named "head".
      PAGES_BRANCH: ${{ github.event.release.prerelease && 'dev' || 'main' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the docs' "last updated" dates come from each
          # page's own commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The release's docs version must already be cut and merged: the
      # version in packages/frame/release.ts has to be in apps/docs/versions.json,
      # newest first, and no cut version may take vNext's name or path.
      # Nothing builds or deploys until it is, so a release can't ship docs
      # without its own version. The fix is a PR that runs
      # `npm run docs:version`, then publishing the release again.
      - name: Check the docs version for this release
        run: npm run check:docs-version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Both sites build before either deploys, so a failed build never
      # leaves one site on the new release and the other on the old one.
      - name: Build the site
        run: npm run build -w @sneakers-pam/site

      # The published docs leave out vNext (unreleased main).
      - name: Build the docs
        env:
          DOCS_INCLUDE_NEXT: "false"
        run: npm run build -w @sneakers-pam/docs

      # Each step creates its Pages project on the first run only. `--json`
      # gives a real array of {"Project Name": ...} objects to match exactly
      # against, instead of grep-ing wrangler's table output (which would
      # also match a longer name that merely starts with this one, since "-"
      # isn't a word-boundary character). No set -x and nothing here echoes
      # the token or account ID. wrangler isn't on the PATH inside
      # preCommands, so those calls go through npx.
      - name: Deploy the site
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            npx wrangler pages project list --json | jq -e '[.[] | select(."Project Name" == "sneakers-pam-www")] | length > 0' >/dev/null || npx wrangler pages project create sneakers-pam-www --production-branch=main
          command: pages deploy apps/site/build/client --project-name=sneakers-pam-www --branch=${{ env.PAGES_BRANCH }}

      - name: Deploy the docs
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            npx wrangler pages project list --json | jq -e '[.[] | select(."Project Name" == "sneakers-pam-docs")] | length > 0' >/dev/null || npx wrangler pages project create sneakers-pam-docs --production-branch=main
          command: pages deploy apps/docs/build --project-name=sneakers-pam-docs --branch=${{ env.PAGES_BRANCH }}
