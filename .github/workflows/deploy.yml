name: deploy

# Only a published release deploys this site. No push or pull_request
# trigger here: a merge to main never deploys on its own.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Create the Pages project on the first run only. `--json` gives a
          # real array of {"Project Name": ...} objects to match exactly
          # against, instead of grep-ing wrangler's table output (which
          # would also match a longer name that merely starts with this
          # one, since "-" isn't a word-boundary character). No set -x and
          # nothing here echoes the token or account ID.
          preCommands: |
            wrangler pages project list --json | jq -e '[.[] | select(."Project Name" == "sneakers-pam-www")] | length > 0' >/dev/null || wrangler pages project create sneakers-pam-www --production-branch=main
          command: pages deploy build/client --project-name=sneakers-pam-www
