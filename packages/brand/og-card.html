<!doctype html>
<!--
  The source of public/img/og-card.png, the link-preview card both sites
  point og:image at: the Sneakers-PAM mark and wordmark and the trademarked
  tagline on the home page's hero band (the grid backdrop and the sole's
  glow), in the frame's fonts and light colours. To change the card, edit
  this page, render it headless at a 1200x630 viewport with a device scale
  of 1, screenshot the full viewport to that path, and check the file
  carries no C2PA or caBX metadata (packages/brand/brand.test.ts).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sneakers-PAM link-preview card</title>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        font-weight: 500 800;
        src: url("../frame/public/fonts/bricolage-grotesque-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 400 700;
        src: url("../frame/public/fonts/jetbrains-mono-latin.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f4f0e8;
      }
      .card {
        position: relative;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 88px 104px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 44px;
        overflow: hidden;
        background: #f4f0e8;
      }
      .backdrop {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(to right, #e4ded3 1px, transparent 1px),
          linear-gradient(to bottom, #e4ded3 1px, transparent 1px);
        background-size: 48px 48px;
        opacity: 0.6;
        mask-image: linear-gradient(to bottom, black, transparent 85%);
      }
      .glow {
        position: absolute;
        top: -260px;
        right: -200px;
        width: 720px;
        height: 720px;
        border-radius: 50%;
        background: radial-gradient(circle, #f07a2b 0%, transparent 70%);
        opacity: 0.3;
        filter: blur(60px);
      }
      .brand,
      .tagline,
      .site {
        position: relative;
        z-index: 1;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .brand img {
        width: 112px;
        height: 112px;
      }
      .wordmark {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 700;
        font-size: 76px;
        letter-spacing: -0.01em;
        color: #1c2230;
      }
      .tagline {
        margin: 0;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 700;
        font-size: 74px;
        line-height: 1.12;
        color: #1c2230;
      }
      .tagline span {
        display: block;
      }
      .tagline .accent {
        color: #c2571a;
      }
      .tagline sup {
        font-size: 0.5em;
        vertical-align: super;
        line-height: 0;
      }
      .site {
        margin: 0;
        font-family: "JetBrains Mono", monospace;
        font-weight: 400;
        font-size: 26px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5a6170;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="backdrop"></div>
      <div class="glow"></div>
      <div class="brand">
        <img src="public/img/mark-light.svg" alt="" />
        <div class="wordmark">sneakers·pam</div>
      </div>
      <p class="tagline">
        <span>Privileged access,</span>
        <span class="accent">kept on a short leash<sup>™</sup>.</span>
      </p>
      <p class="site">sneakers-pam.com</p>
    </div>
  </body>
</html>
